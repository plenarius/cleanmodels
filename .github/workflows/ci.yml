name: CI

on:
  push:
    branches: [main, v4-go-rewrite]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Format
        # Linux only: Windows checkouts may convert line endings, which gofmt
        # would flag on every file.
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  python:
    # The Python port (python/) must do exactly what the Go code does: the
    # decompiler, the ASCII parser and the compiler; see python/README.md.
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10" # Blender 3.3's
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Merged render lists
        run: python python/merged_test.py

      - name: Parity with the Go decompiler
        run: python python/parity_test.py

      - name: Parity with the Go parser
        run: python python/parity_parse.py

      - name: Parity with the Go compiler
        run: python python/parity_compile.py

      - name: Decompile round-trip fixes
        run: python python/decompile_fixes_test.py

      - name: Parser and writer fixes
        run: python python/parse_fixes_test.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    # The signing secrets live in this environment, which only v* tags can use.
    environment: release
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v6
      - name: Python port names this release
        # python/cleanmodels/__init__.py's PORTED_FROM tells NeverBlender (which
        # vendors the port) which release it matches; v4.18.0 went out with the old one.
        run: |
          grep -qx "PORTED_FROM = \"${GITHUB_REF_NAME}\"" python/cleanmodels/__init__.py || {
            echo "::error file=python/cleanmodels/__init__.py::PORTED_FROM must be \"${GITHUB_REF_NAME}\" for this release"; exit 1; }
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Windows version info
        # Embeds product name, version, description and an asInvoker manifest
        # in the .exe. A PE file with no metadata looks suspicious to
        # antivirus heuristics. The tool runs here only; it is not a module
        # dependency, and the .syso is linked into Windows builds only.
        if: matrix.goos == 'windows'
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          V="${VERSION_TAG#v}"
          go run github.com/tc-hib/go-winres@v0.3.3 simply \
            --arch "${{ matrix.goarch }}" \
            --out cmd/cleanmodels/rsrc \
            --manifest cli \
            --product-name cleanmodels \
            --product-version "${V}" \
            --file-version "${V}" \
            --file-description "NWN:EE MDL model checker, repairer and compiler" \
            --copyright "Copyright (c) 2020-2026 plenarius. MIT License." \
            --original-filename cleanmodels.exe

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION_TAG: ${{ github.ref_name }}
          CLIENT_KEY: ${{ secrets.REPORT_CLIENT_KEY }}
        run: |
          EXT=""
          if [ "${GOOS}" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION_TAG} -X main.clientKey=${CLIENT_KEY}" \
            -o "cleanmodels-${GOOS}-${GOARCH}${EXT}" \
            ./cmd/cleanmodels

      - name: Sign and notarize (macOS)
        # Developer ID signature plus Apple notarization, so Gatekeeper opens
        # the binary without the "unidentified developer" block. rcodesign
        # does both from Linux. A bare binary can't be stapled; Gatekeeper
        # checks the notarization online on first run.
        if: matrix.goos == 'darwin'
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          RCS=apple-codesign-0.29.0-x86_64-unknown-linux-musl
          curl -fsSLO "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/${RCS}.tar.gz"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  ${RCS}.tar.gz" | sha256sum -c -
          tar xzf "${RCS}.tar.gz"
          S="$(mktemp -d)"
          echo "$P12" | base64 -d > "$S/id.p12"
          printf '%s' "$P12_PASSWORD" > "$S/pass"
          printf '%s\n' "$NOTARY_KEY" > "$S/key.p8"
          # Only the Developer ID certificate and its key: the .p12 also holds
          # Apple's intermediate, which rcodesign would otherwise sign with.
          openssl pkcs12 -legacy -in "$S/id.p12" -passin "file:$S/pass" -nocerts -nodes -out "$S/key.pem"
          openssl pkcs12 -legacy -in "$S/id.p12" -passin "file:$S/pass" -clcerts -nokeys -out "$S/cert.pem"
          "$RCS/rcodesign" encode-app-store-connect-api-key -o "$S/api.json" "$NOTARY_ISSUER" "$NOTARY_KEY_ID" "$S/key.p8"
          BIN="cleanmodels-${{ matrix.goos }}-${{ matrix.goarch }}"
          "$RCS/rcodesign" sign --pem-file "$S/key.pem" --pem-file "$S/cert.pem" --code-signature-flags runtime "$BIN"
          zip -q notarize.zip "$BIN"
          "$RCS/rcodesign" notary-submit --api-key-file "$S/api.json" --max-wait-seconds 3600 --wait notarize.zip
          rm -rf "$S" notarize.zip "${RCS}" "${RCS}.tar.gz"

      - name: Compress
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          ARCHIVE="cleanmodels-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          zip "${ARCHIVE}" "cleanmodels-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cleanmodels-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.zip"

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build cleanmodels.wasm
        env:
          GOOS: js
          GOARCH: wasm
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/wasm
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION_TAG}" \
            -o dist/wasm/cleanmodels.wasm \
            ./cmd/cleanmodels-wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" dist/wasm/wasm_exec.js
          ls -la dist/wasm/

      - name: Package wasm bundle
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: dist/wasm
        run: zip ../../cleanmodels-wasm.zip cleanmodels.wasm wasm_exec.js

      - name: Upload wasm artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: cleanmodels-wasm
          path: cleanmodels-wasm.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            *.zip
            SHA256SUMS.txt
